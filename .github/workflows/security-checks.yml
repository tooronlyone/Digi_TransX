name: Digi_TransX V1 Security & Verification Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only_password
          POSTGRES_DB: dtx_phase1b2c0_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned V1 backend runtime and verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-virtualenv -r backend/requirements.lock || pip install -r backend/requirements.lock
          pip install pytest pip-audit

      - name: Audit pinned Python dependencies
        run: pip-audit -r backend/requirements.lock

      - name: Check repository configuration and secret hygiene
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          assert ".env" not in tracked, ".env must never be committed"
          env_example = pathlib.Path(".env.example").read_text(encoding="utf-8")
          assert "FLASK_DEBUG=false" in env_example, ".env.example must keep FLASK_DEBUG=false"
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"sb_secret_[A-Za-z0-9_-]{16,}"),
              re.compile(r"eyJhbGciOi[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\."),
          ]
          for rel in tracked:
              p = pathlib.Path(rel)
              if p.is_file() and p.suffix not in {".png", ".jpg", ".jpeg", ".webp", ".woff2"}:
                  txt = p.read_text(encoding="utf-8", errors="ignore")
                  for pat in secret_patterns:
                      if pat.search(txt):
                          raise AssertionError(f"Potential secret material matched in {rel}")
          print(f"Scanned {len(tracked)} tracked files with zero secret matches.")
          PY

      - name: Run V1 backend and isolated PostgreSQL security test suite
        env:
          DIGITRANSX_ENVIRONMENT: test
          TEST_SUPABASE_DB_URL: postgresql://postgres:postgres_ci_only_password@127.0.0.1:5432/dtx_phase1b2c0_test
        run: pytest backend/tests -q

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install pinned frontend dependencies
        run: npm ci

      - name: Audit production bundle dependencies
        run: npm audit --omit=dev

      - name: Lint, test, and build V1 frontend
        run: |
          npm run lint
          npm run test:components
          node --test tests/*.mjs
          npm run build
